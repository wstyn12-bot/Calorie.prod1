<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>calorie.prod</title>
    <meta name="description" content="Snap your food, track calories and macros, and keep your streak going." />
    <meta name="theme-color" content="#f4f4f1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="calorie.prod" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="/styles.css" />
    <script src="/js/theme.js"></script>
    <script type="module" src="/js/app.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <input type="file" id="file-camera" accept="image/*" capture="environment" hidden />
    <input type="file" id="file-library" accept="image/*" hidden />
    <input type="file" id="file-import" accept=".json,application/json" hidden />
    <noscript><p style="padding: 24px; font-family: sans-serif">calorie.prod needs JavaScript turned on.</p></noscript>
  </body>
</html>
